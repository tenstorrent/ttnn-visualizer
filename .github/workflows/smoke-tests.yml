name: Smoke Tests

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  BASE_PATH: /
  NPM_CONFIG_PRODUCTION: false

jobs:
  build-wheel:
    name: Build Python Wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build

      - name: Read .python-version
        id: python
        run: echo "PYTHON_VERSION=$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ steps.python.outputs.PYTHON_VERSION }}
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: dist/*.whl

  smoke-test:
    name: Smoke Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: python-wheel
          path: dist/

      - name: Install wheel and dependencies
        run: |
          # Isolated venv so we test the wheel artifact, not the editable checkout.
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv dist/*.whl playwright
          /tmp/smoke-venv/bin/playwright install --with-deps chromium

      - name: Start ttnn-visualizer server in background
        run: |
          # Start the server in the background
          /tmp/smoke-venv/bin/ttnn-visualizer &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to start (max 30 seconds)
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8000 >/dev/null 2>&1; then
              echo "Server is running!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start within 30 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

      - name: Test server with curl
        run: |
          # Test that we can reach the server
          curl -f http://localhost:8000
          echo "✅ Server responded to curl request"

      - name: Run Playwright smoke test
        run: |
          /tmp/smoke-venv/bin/python scripts/smoke_test.py

      - name: Cleanup
        if: always()
        run: |
          # Kill the server process
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
          # Also kill any ttnn-visualizer processes that might be running
          pkill -f "ttnn-visualizer" 2>/dev/null || true
          pkill -f "gunicorn.*ttnn_visualizer" 2>/dev/null || true

  hosted-smoke-test:
    # `smoke-test` above starts the wheel with no environment, so SERVER_MODE is false
    # and the hosted boot path has never been exercised end to end in CI. That is the
    # path that broke in v0.102.0 (#2004): every gunicorn worker raised at import and
    # the arbiter halted, and nothing here would have noticed.
    #
    # This cannot catch a requirement that existing *deployments* fail — CI supplies a
    # conforming value by construction, and that limit is the reason the registry and
    # `--check-config` exist. What it does catch is a hosted-only boot regression, and
    # it pins the preflight contract a deploy gate depends on: exit 0 means it starts.
    name: Hosted Smoke Test
    runs-on: ubuntu-latest
    needs: build-wheel

    env:
      SERVER_MODE: 'true'
      # Hosted event logs are written under /data/usage, which a runner has no reason
      # to provide. Recording is orthogonal to the boot path under test, so switch it
      # off rather than provisioning a directory the test does not assert on.
      USAGE_RECORDING_DISABLED: 'true'
      LAUNCH_BROWSER_ON_START: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read .python-version
        id: python
        run: echo "PYTHON_VERSION=$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ steps.python.outputs.PYTHON_VERSION }}
          enable-cache: true

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: python-wheel
          path: dist/

      - name: Install wheel
        run: |
          uv venv /tmp/hosted-venv
          uv pip install --python /tmp/hosted-venv dist/*.whl

      - name: Generate a conforming SECRET_KEY
        run: |
          set -euo pipefail
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "${GITHUB_ENV}"

      - name: Preflight accepts a conforming hosted environment
        run: |
          set -euo pipefail
          /tmp/hosted-venv/bin/ttnn-visualizer --check-config

      - name: Preflight refuses an environment the release cannot start in
        run: |
          set -uo pipefail
          # Deliberately under the floor. If this ever exits 0 the preflight contract is
          # broken, and a deploy gate reading the exit code would wave through a
          # deployment that cannot boot.
          SECRET_KEY=short /tmp/hosted-venv/bin/ttnn-visualizer --check-config
          status=$?
          if [ "${status}" -eq 0 ]; then
            echo "::error::--check-config exited 0 for an environment that cannot start."
            exit 1
          fi
          echo "✅ Preflight rejected the non-conforming environment (exit ${status})"

      - name: Start ttnn-visualizer in hosted posture
        run: |
          set -euo pipefail
          /tmp/hosted-venv/bin/ttnn-visualizer &
          echo "SERVER_PID=$!" >> "${GITHUB_ENV}"

          echo "Waiting for the hosted server to start..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000 >/dev/null 2>&1; then
              echo "✅ Hosted server is serving"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Hosted server failed to start within 30 seconds."
          exit 1

      - name: Local-only endpoints are refused under SERVER_MODE
        run: |
          set -euo pipefail
          # Boots *and* boots into the right posture. A hosted start that silently fell
          # back to local would pass the step above while un-gating every @local_only
          # endpoint, which is the failure worth catching here.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/remote/ssh-config-hosts)"
          if [ "${status}" != "403" ]; then
            echo "::error::Expected 403 from a @local_only endpoint under SERVER_MODE, got ${status}."
            exit 1
          fi
          echo "✅ @local_only endpoint returned 403"

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
          pkill -f "ttnn-visualizer" 2>/dev/null || true
          pkill -f "gunicorn.*ttnn_visualizer" 2>/dev/null || true
