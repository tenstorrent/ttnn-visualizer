name: Checking SPDX License Headers

on:
    pull_request:
        branches: [ "dev" ]
    workflow_dispatch:

jobs:
    check-headers:
        name: Check Headers
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version-file: '.nvmrc'

            # Run the script directly rather than through `pnpm lint:spdx`: it imports only
            # `fs` and `path` and skips node_modules, so pnpm and the dependency tree buy nothing.
            -   name: Running check license identifiers
                run: node scripts/check-spdx.mjs
