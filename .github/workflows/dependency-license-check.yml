name: Checking Dependency Licenses

on:
    pull_request:
        branches: [ "dev" ]
    workflow_dispatch:

jobs:
    check-licenses:
        name: Check Licenses
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   uses: pnpm/action-setup@v6
                name: Install pnpm
                with:
                    run_install: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version-file: '.nvmrc'
                    cache: 'pnpm'

            -   name: Install dependencies
                run: pnpm install

            -   name: Run license check
                id: license_check
                run: |
                    pnpm licenses ls --json | node scripts/check-missing-dep-licenses.mjs

